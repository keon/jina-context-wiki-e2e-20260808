steps:
  - id: validate-release-identity
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
        [[ "${_RELEASE_ID}" =~ ^[a-z0-9][a-z0-9._-]{0,119}$ ]]
        [[ "${_RELEASE_EVIDENCE_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]{2,221}[a-z0-9]$ ]]
        test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-release-identity]
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name jina-release-postgres --network cloudbuild \
          --env POSTGRES_DB=jina_test \
          --env POSTGRES_USER=postgres \
          --env POSTGRES_PASSWORD=postgres \
          postgres:16-alpine
        until docker exec jina-release-postgres pg_isready -U postgres -d jina_test; do
          sleep 1
        done

  - id: validate
    name: node:22-bookworm
    waitFor: [start-postgres]
    entrypoint: bash
    args: [scripts/cloud-build-ci.sh]
    env:
      - DATABASE_URL=postgresql://postgres:postgres@jina-release-postgres:5432/jina_test
      - TEST_DATABASE_URL=postgresql://postgres:postgres@jina-release-postgres:5432/jina_test

  - id: record-source-manifest
    name: node:22-bookworm
    waitFor: [validate]
    entrypoint: node
    args:
      - -e
      - |
        const fs = require("node:fs");
        fs.writeFileSync("/workspace/release-build-source.json", JSON.stringify({
          schema_version: 1,
          release_id: "${_RELEASE_ID}",
          build_id: "${BUILD_ID}",
          project_id: "${PROJECT_ID}",
          commit_sha: "${COMMIT_SHA}",
          images: ["api", "worker", "dashboard", "admin"].map((name) =>
            `us-east1-docker.pkg.dev/${PROJECT_ID}/jina/${name}:${_RELEASE_ID}`),
          note: "Resolve immutable digests, verified provenance, and SBOM references from the completed Cloud Build result."
        }, null, 2) + "\n");

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:${_RELEASE_ID}
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/worker/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:${_RELEASE_ID}
      - .

  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/dashboard/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/dashboard:${_RELEASE_ID}
      - .

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/admin/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/admin:${_RELEASE_ID}
      - .

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:${_RELEASE_ID}
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:${_RELEASE_ID}
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/dashboard:${_RELEASE_ID}
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/admin:${_RELEASE_ID}

artifacts:
  objects:
    location: gs://${_RELEASE_EVIDENCE_BUCKET}/${_RELEASE_ID}/build/
    paths: [release-build-source.json]

substitutions:
  _RELEASE_ID: unset
  _RELEASE_EVIDENCE_BUCKET: unset

timeout: 7200s
serviceAccount: projects/jina-v2/serviceAccounts/jina-cloud-build-deployer@jina-v2.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
  sourceProvenanceHash: [SHA256]
