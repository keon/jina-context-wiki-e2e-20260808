packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - protobufjs
allowBuilds:
  esbuild: true
  protobufjs: true
  # sharp is an optional next/image optimizer; the Next.js apps serve no
  # optimized images, so its native postinstall is intentionally skipped.
  sharp: false

overrides:
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  # Next 16 currently resolves an older PostCSS line. Force the patched release
  # until its own dependency range catches up.
  "postcss": ">=8.5.10"
  # The MCP SDK accepts the current Hono peer API but still resolves a
  # pre-2.x node adapter with a Windows traversal advisory.
  "@hono/node-server": ">=2.0.5"
  # next pulls sharp <0.35 (optional image optimizer) which carries a high-sev
  # libvips advisory; the admin app uses no next/image, so force the patched
  # line to keep `pnpm audit --prod --audit-level=high` clean.
  "sharp": ">=0.35.0"
  # Patched transitive releases for minimatch/ESLint and the Daytona SDK.
  "brace-expansion": ">=5.0.8"
  "tar": ">=7.5.21"

minimumReleaseAgeExclude:
  - knip@6.29.0
