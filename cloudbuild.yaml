steps:
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name jina-ci-postgres --network cloudbuild \
          --env POSTGRES_DB=jina_test \
          --env POSTGRES_USER=postgres \
          --env POSTGRES_PASSWORD=postgres \
          postgres:16-alpine
        until docker exec jina-ci-postgres pg_isready -U postgres -d jina_test; do
          sleep 1
        done

  - id: validate
    name: node:22-bookworm
    waitFor: [start-postgres]
    entrypoint: bash
    args: [scripts/cloud-build-ci.sh]
    env:
      # DATABASE_URL additionally runs the product migration smoke test in
      # cloud-build-ci.sh, matching cloudbuild.ci.yaml, so a regressed
      # migration fails validation instead of the release deploy step.
      - DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test
      - TEST_DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-image-selection]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then
          echo "Reusing accepted API image ${_JINA_EXISTING_IMAGE_TAG}"
          exit 0
        fi
        docker build \
          --file=apps/api/Dockerfile \
          --label=org.opencontainers.image.revision=$COMMIT_SHA \
          --label=org.opencontainers.image.source=https://github.com/omxyz/jina \
          --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:$BUILD_ID \
          .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-image-selection]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then
          echo "Reusing accepted worker image ${_JINA_EXISTING_IMAGE_TAG}"
          exit 0
        fi
        docker build \
          --file=apps/worker/Dockerfile \
          --label=org.opencontainers.image.revision=$COMMIT_SHA \
          --label=org.opencontainers.image.source=https://github.com/omxyz/jina \
          --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:$BUILD_ID \
          .

  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-image-selection]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then
          echo "Reusing accepted dashboard image ${_JINA_EXISTING_IMAGE_TAG}"
          exit 0
        fi
        docker build \
          --file=apps/dashboard/Dockerfile \
          --build-arg=NEXT_PUBLIC_API_BASE_URL=${_JINA_PUBLIC_API_BASE_URL} \
          --build-arg=NEXT_PUBLIC_JINA_DASHBOARD_AUTH_MODE=${_JINA_DASHBOARD_AUTH_MODE} \
          --label=org.opencontainers.image.revision=$COMMIT_SHA \
          --label=org.opencontainers.image.source=https://github.com/omxyz/jina \
          --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/dashboard:$BUILD_ID \
          .

  - id: build-admin
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-image-selection]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then
          echo "Reusing accepted admin image ${_JINA_EXISTING_IMAGE_TAG}"
          exit 0
        fi
        docker build \
          --file=apps/admin/Dockerfile \
          --label=org.opencontainers.image.revision=$COMMIT_SHA \
          --label=org.opencontainers.image.source=https://github.com/omxyz/jina \
          --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/admin:$BUILD_ID \
          .

  - id: validate-image-selection
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    entrypoint: bash
    args:
      - -ceu
      - |
        reuse="${_JINA_REUSE_EXISTING_IMAGE_TAG}"
        tag="${_JINA_EXISTING_IMAGE_TAG}"
        if [[ "$${reuse}" == "false" ]]; then
          test -z "$${tag}"
          exit 0
        fi
        [[ "$${reuse}" == "true" ]]
        [[ "$${tag}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]
        [[ "${_JINA_DEPLOYMENT_ACCEPTANCE_MODE}" == "mechanical" || "${_JINA_DEPLOYMENT_ACCEPTANCE_MODE}" == "full" ]]
        for image in api worker dashboard admin; do
          tagged="us-east1-docker.pkg.dev/$PROJECT_ID/jina/$${image}:$${tag}"
          docker pull "$${tagged}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$${tagged}")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$${tagged}")"
          test "$${revision}" = "$COMMIT_SHA"
          test "$${source}" = "https://github.com/omxyz/jina"
        done

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then exit 0; fi
        docker push us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:$BUILD_ID

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-worker]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then exit 0; fi
        docker push us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:$BUILD_ID

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    waitFor: [build-dashboard]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then exit 0; fi
        docker push us-east1-docker.pkg.dev/$PROJECT_ID/jina/dashboard:$BUILD_ID

  - id: push-admin
    name: gcr.io/cloud-builders/docker
    waitFor: [build-admin]
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_JINA_REUSE_EXISTING_IMAGE_TAG}" == "true" ]]; then exit 0; fi
        docker push us-east1-docker.pkg.dev/$PROJECT_ID/jina/admin:$BUILD_ID

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:563.0.0
    waitFor: [push-api, push-worker, push-dashboard, push-admin]
    entrypoint: bash
    args: [scripts/cloud-build-deploy.sh]
    env:
      - GCP_PROJECT_ID=$PROJECT_ID
      - GCP_REGION=us-east1
      - CLOUD_BUILD_ID=$BUILD_ID
      - IMAGE_TAG=${_JINA_EXISTING_IMAGE_TAG}
      - JINA_REUSE_EXISTING_IMAGE_TAG=${_JINA_REUSE_EXISTING_IMAGE_TAG}
      - CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE}
      - JINA_CONTEXT_GCS_BUCKET=${_JINA_CONTEXT_GCS_BUCKET}
      - JINA_TENANCY_MODE=${_JINA_TENANCY_MODE}
      - JINA_DB_NAME=${_JINA_DB_NAME}
      - JINA_DB_USER=${_JINA_DB_USER}
      - JINA_DB_PASS_SECRET=${_JINA_DB_PASS_SECRET}
      - JINA_MIGRATION_DB_USER=${_JINA_MIGRATION_DB_USER}
      - JINA_MIGRATION_DB_PASS_SECRET=${_JINA_MIGRATION_DB_PASS_SECRET}
      - JINA_FIXED_TENANT_ID=${_JINA_FIXED_TENANT_ID}
      - JINA_ACCEPTANCE_REPOSITORY=${_JINA_ACCEPTANCE_REPOSITORY}
      - JINA_ACCEPTANCE_GITHUB_INSTALLATION_ID=${_JINA_ACCEPTANCE_GITHUB_INSTALLATION_ID}
      - JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_ID_SECRET=${_JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_ID_SECRET}
      - JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_SECRET=${_JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_SECRET}
      - JINA_TRIGGER_ACCEPTANCE_GITHUB_INSTALLATION_ID=${_JINA_TRIGGER_ACCEPTANCE_GITHUB_INSTALLATION_ID}
      - JINA_API_MIN_INSTANCES=${_JINA_API_MIN_INSTANCES}
      - JINA_API_MAX_INSTANCES=${_JINA_API_MAX_INSTANCES}
      - JINA_API_CONCURRENCY=${_JINA_API_CONCURRENCY}
      - JINA_API_DB_POOL_MAX=${_JINA_API_DB_POOL_MAX}
      - JINA_API_CPU=${_JINA_API_CPU}
      - JINA_API_MEMORY=${_JINA_API_MEMORY}
      - JINA_CONTEXT_WORKER_MEMORY=${_JINA_CONTEXT_WORKER_MEMORY}
      - JINA_CONTEXT_WORKER_MIN_INSTANCES=${_JINA_CONTEXT_WORKER_MIN_INSTANCES}
      - JINA_CONTEXT_WORKER_MAX_INSTANCES=${_JINA_CONTEXT_WORKER_MAX_INSTANCES}
      - JINA_TASK_WORKER_MAX_INSTANCES=${_JINA_TASK_WORKER_MAX_INSTANCES}
      - JINA_CONTEXT_DAYTONA_SNAPSHOT=${_JINA_CONTEXT_DAYTONA_SNAPSHOT}
      - JINA_CONTEXT_DAYTONA_IMAGE=${_JINA_CONTEXT_DAYTONA_IMAGE}
      - JINA_CONTEXT_DAYTONA_MODEL_SECRET=${_JINA_CONTEXT_DAYTONA_MODEL_SECRET}
      - JINA_CONTEXT_DAYTONA_MODEL_SECRET_ENV=${_JINA_CONTEXT_DAYTONA_MODEL_SECRET_ENV}
      - JINA_CONTEXT_DAYTONA_MODEL_DOMAINS=${_JINA_CONTEXT_DAYTONA_MODEL_DOMAINS}
      - JINA_CONTEXT_CHECKPOINT_PUBLICATION_OVERRIDE_BUILD_IDS=${_JINA_CONTEXT_CHECKPOINT_PUBLICATION_OVERRIDE_BUILD_IDS}
      - JINA_PRODUCT_INTERNAL_API_TOKEN_SECRET=${_JINA_PRODUCT_INTERNAL_API_TOKEN_SECRET}
      - JINA_WORKER_RELEASE_SECRET=${_JINA_WORKER_RELEASE_SECRET}
      - JINA_ACCEPTANCE_DERIVATION_BUDGET_SECONDS=${_JINA_ACCEPTANCE_DERIVATION_BUDGET_SECONDS}
      - JINA_ACCEPTANCE_DERIVATION_TOKEN_BUDGET=${_JINA_ACCEPTANCE_DERIVATION_TOKEN_BUDGET}
      - JINA_ACCEPTANCE_TIMEOUT_MS=${_JINA_ACCEPTANCE_TIMEOUT_MS}
      - JINA_ACCEPTANCE_JOB_TIMEOUT_SECONDS=${_JINA_ACCEPTANCE_JOB_TIMEOUT_SECONDS}
      - JINA_DEPLOYMENT_ACCEPTANCE_MODE=${_JINA_DEPLOYMENT_ACCEPTANCE_MODE}
      - JINA_CONTEXT_RESET_MODE=${_JINA_CONTEXT_RESET_MODE}
      - JINA_CONFIRM_CONTEXT_RESET=${_JINA_CONFIRM_CONTEXT_RESET}
    timeout: 16200s

substitutions:
  # Identity/control-plane and context schemas share the production database;
  # tenant isolation is enforced by bound principals, tenant-scoped SQL, and
  # NOINHERIT capability roles. RLS additionally fences consumer-owned queues.
  _CLOUD_SQL_INSTANCE: jina-463721:us-east1:jina-db
  _JINA_CONTEXT_GCS_BUCKET: jina-v2-jina-context-artifacts-us-east1
  _JINA_TENANCY_MODE: shared-db
  _JINA_DB_NAME: jina
  _JINA_DB_USER: jina_v2_app
  _JINA_DB_PASS_SECRET: jina-shared-db-password:latest
  _JINA_MIGRATION_DB_USER: jina_app
  _JINA_MIGRATION_DB_PASS_SECRET: jina-primary-owner-db-password:latest
  _JINA_FIXED_TENANT_ID: omlabs
  _JINA_ACCEPTANCE_REPOSITORY: omxyz/jina-context-graph-e2e
  _JINA_ACCEPTANCE_GITHUB_INSTALLATION_ID: "140435029"
  _JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_ID_SECRET: jina-trigger-acceptance-github-app-id
  _JINA_TRIGGER_ACCEPTANCE_GITHUB_APP_PRIVATE_KEY_SECRET: jina-trigger-acceptance-github-app-private-key
  _JINA_TRIGGER_ACCEPTANCE_GITHUB_INSTALLATION_ID: "150069172"
  # Keep one API container warm so dashboard reads do not pay a Cloud Run cold
  # start. Each API instance owns three PostgreSQL pools capped at three
  # connections, keeping four instances within an aggregate budget of 36.
  _JINA_API_MIN_INSTANCES: "1"
  _JINA_API_MAX_INSTANCES: "4"
  _JINA_API_CONCURRENCY: "10"
  _JINA_API_DB_POOL_MAX: "3"
  _JINA_API_CPU: "1"
  _JINA_API_MEMORY: 1Gi
  _JINA_CONTEXT_WORKER_MEMORY: 1Gi
  # Context workers poll the Board in the background, so Cloud Run request
  # autoscaling cannot observe queue depth. Keep the requested 20 executors
  # warm explicitly; max-instances alone would leave only the prior minimum.
  _JINA_CONTEXT_WORKER_MIN_INSTANCES: "20"
  _JINA_CONTEXT_WORKER_MAX_INSTANCES: "100"
  _JINA_TASK_WORKER_MAX_INSTANCES: "5"
  # The audited immutable Daytona snapshot contains the Codex CLI. Override it
  # only with another validated immutable snapshot, or clear it and supply one
  # digest-pinned image.
  _JINA_CONTEXT_DAYTONA_SNAPSHOT: jina-context-board-codex-0-145-0-bwrap-v2
  _JINA_CONTEXT_DAYTONA_IMAGE: ""
  # This is the name of an existing Daytona organization Secret, not its value
  # and not a Google Secret Manager version.
  _JINA_CONTEXT_DAYTONA_MODEL_SECRET: jina-context-openai
  _JINA_CONTEXT_DAYTONA_MODEL_SECRET_ENV: OPENAI_API_KEY
  _JINA_CONTEXT_DAYTONA_MODEL_DOMAINS: api.openai.com
  _JINA_CONTEXT_CHECKPOINT_PUBLICATION_OVERRIDE_BUILD_IDS: ""
  _JINA_PRODUCT_INTERNAL_API_TOKEN_SECRET: jina-v1-internal-api-token
  # Production keeps the established GitHub session contract. Staging's Vercel
  # project remains Clerk-backed and does not consume these image build args.
  _JINA_PUBLIC_API_BASE_URL: https://api.usejina.com
  _JINA_DASHBOARD_AUTH_MODE: github
  _JINA_WORKER_RELEASE_SECRET: jina-worker-release-credential
  # A measured full Board run takes about 2.5 hours. The acceptance poll gets
  # three hours, with a further fifteen-minute Cloud Run job envelope.
  _JINA_ACCEPTANCE_DERIVATION_BUDGET_SECONDS: "10800"
  _JINA_ACCEPTANCE_DERIVATION_TOKEN_BUDGET: "24000000"
  _JINA_ACCEPTANCE_TIMEOUT_MS: "10800000"
  _JINA_ACCEPTANCE_JOB_TIMEOUT_SECONDS: "11700"
  # A source push may build and validate candidates, but production traffic is
  # an explicit operator decision made only after the release evidence is
  # accepted. Select "mechanical" for readiness-gated routing or "full" for the
  # complete Context acceptance gate; the safe default never changes traffic.
  _JINA_DEPLOYMENT_ACCEPTANCE_MODE: deferred
  # An explicit mechanical/full rerun may reuse the exact images produced by
  # the successful deferred build. validate-image-selection pulls all four
  # images and requires their source labels to match this build's COMMIT_SHA.
  _JINA_EXISTING_IMAGE_TAG: ""
  _JINA_REUSE_EXISTING_IMAGE_TAG: "false"
  # Normal releases accept only the current schema. The first Context
  # production transition must override both values explicitly:
  #   _JINA_CONTEXT_RESET_MODE=legacy-once
  #   _JINA_CONFIRM_CONTEXT_RESET=delete-rebuildable-context
  # The transition removes its legacy-table marker, so replay fails closed.
  _JINA_CONTEXT_RESET_MODE: disabled
  _JINA_CONFIRM_CONTEXT_RESET: ""

timeout: 21600s
serviceAccount: projects/jina-v2/serviceAccounts/jina-cloud-build-deployer@jina-v2.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
