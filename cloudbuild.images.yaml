steps:
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name jina-ci-postgres --network cloudbuild \
          --env POSTGRES_DB=jina_test \
          --env POSTGRES_USER=postgres \
          --env POSTGRES_PASSWORD=postgres \
          postgres:16-alpine
        until docker exec jina-ci-postgres pg_isready -U postgres -d jina_test; do
          sleep 1
        done

  - id: validate
    name: node:22-bookworm
    waitFor: [start-postgres]
    entrypoint: bash
    args: [scripts/cloud-build-ci.sh]
    env:
      - TEST_DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/jina/api:${_IMAGE_TAG}
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/worker/Dockerfile
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/jina/worker:${_IMAGE_TAG}
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/jina/api:${_IMAGE_TAG}

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-worker]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/jina/worker:${_IMAGE_TAG}

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/jina/api:${_IMAGE_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/jina/worker:${_IMAGE_TAG}

substitutions:
  _IMAGE_TAG: manual

timeout: 3600s
serviceAccount: projects/jina-v2/serviceAccounts/jina-cloud-build-deployer@jina-v2.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
