steps:
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name jina-ci-postgres --network cloudbuild \
          --env POSTGRES_DB=jina_test \
          --env POSTGRES_USER=postgres \
          --env POSTGRES_PASSWORD=postgres \
          postgres:16-alpine
        until docker exec jina-ci-postgres pg_isready -U postgres -d jina_test; do
          sleep 1
        done

  - id: validate
    name: node:22-bookworm
    waitFor: [start-postgres]
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.15.1 --activate
        pnpm install --frozen-lockfile --store-dir=/tmp/pnpm-store
        pnpm typecheck
        pnpm --filter @jina/api build
        pnpm --filter @jina/api migrate:product
        unset DATABASE_URL
        pnpm test
        pnpm --filter @jina/dashboard build
        pnpm --filter @jina/admin build
        pnpm audit --prod --audit-level=high
    env:
      - DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test
      - TEST_DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:${_IMAGE_TAG}
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/worker/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/worker:${_IMAGE_TAG}
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:${_IMAGE_TAG}

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-worker]
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/worker:${_IMAGE_TAG}

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:${_IMAGE_TAG}
  - us-east1-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/worker:${_IMAGE_TAG}

substitutions:
  _ARTIFACT_REPOSITORY: jina-staging
  _IMAGE_TAG: manual-staging

timeout: 3600s
serviceAccount: projects/jina-staging-20260802/serviceAccounts/jina-cloud-build-staging@jina-staging-20260802.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
