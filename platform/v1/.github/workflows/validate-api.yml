name: Validate API and Dashboard

on:
  pull_request:
    paths:
      - api/**
      - dashboard/**
      - migrations/**
      - .github/workflows/deploy-api.yml
      - .github/workflows/validate-api.yml

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jina_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm --prefix api ci
      - run: npm --prefix api run typecheck
      - name: Run API unit tests
        run: DATABASE_URL= TEST_DATABASE_URL= npm --prefix api test
      - run: npm --prefix api run migrate
      - name: Run PostgreSQL compatibility and transition tests
        working-directory: api
        run: |
          set -euo pipefail
          node --test --import tsx src/dashboard-projection-postgres.test.ts
          node --test --import tsx src/identity-transition-postgres.test.ts
          node --test --import tsx src/internal-user-postgres.test.ts
          node --test --import tsx src/jina-organization-postgres.test.ts
          node --test --import tsx src/tenant-github-connections-postgres.test.ts
          node --test --import tsx src/tenant-review-feed-postgres.test.ts
          npm run identity:backfill -- --dry-run --require-converged

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
