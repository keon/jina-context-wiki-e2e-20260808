name: Validate API, Review Worker, and Dashboard

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/worker/**
      - platform/v1/trigger/**
      - apps/dashboard/**
      - pnpm-lock.yaml
      - .github/workflows/validate-platform.yml

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jina_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/api build
      - run: pnpm --filter @jina/api migrate:product
      - run: pnpm --filter @jina/api test
      - run: pnpm --filter @jina/api identity:backfill -- --dry-run --require-converged

  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/v1/trigger/package-lock.json
      - run: npm --prefix platform/v1/trigger ci
      - run: npm --prefix platform/v1/trigger run typecheck
      - run: npm --prefix platform/v1/trigger test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/dashboard typecheck
      - run: pnpm --filter @jina/dashboard test
      - run: pnpm --filter @jina/dashboard build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/worker typecheck
      - run: pnpm --filter @jina/worker test
