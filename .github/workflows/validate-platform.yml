name: Validate API, Trigger Services, Workers, and Dashboard

on:
  pull_request:
    paths:
      - apps/api/**
      - apps/worker/**
      - services/context-trigger/**
      - apps/dashboard/**
      - packages/db/**
      - packages/observability/**
      - packages/review-agent/**
      - scripts/cloud-build-deploy.test.mjs
      - scripts/check-staging-readiness.sh
      - scripts/deploy-staging.sh
      - scripts/deploy-staging-causal-graph.sh
      - cloudbuild.staging.yaml
      - pnpm-lock.yaml
      - .github/workflows/validate-platform.yml
      - .github/workflows/deploy-context-trigger.yml

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/cloud-build-deploy.test.mjs scripts/deploy-staging-causal-graph.test.mjs

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jina_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/api build
      - run: pnpm --filter @jina/api exec node dist/product/migrate-all.js
      - run: pnpm --filter @jina/api test

  review-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/review-agent typecheck
      - run: pnpm --filter @jina/review-agent test

  context-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: services/context-trigger/package-lock.json
      - run: npm --prefix services/context-trigger ci
      - run: npm --prefix services/context-trigger run typecheck
      - run: npm --prefix services/context-trigger test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/dashboard typecheck
      - run: pnpm --filter @jina/dashboard test
      - run: pnpm --filter @jina/dashboard build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jina/review-agent build
      - run: pnpm --filter @jina/worker typecheck
      - run: pnpm --filter @jina/worker test
