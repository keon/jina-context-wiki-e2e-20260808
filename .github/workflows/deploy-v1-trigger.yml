name: Deploy V1 Review Trigger

# Staging deployments are intentionally dispatched only from the staging ref.

on:
  push:
    branches:
      - main
      - staging
    paths:
      - platform/v1/trigger/**
      - .github/workflows/deploy-v1-trigger.yml
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub deployment environment to use"
        required: true
        type: choice
        default: Staging
        options:
          - Staging
          - Production

permissions:
  contents: read

concurrency:
  group: deploy-v1-trigger-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'Production' || 'Staging') }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'Production' || 'Staging') }}
    defaults:
      run:
        working-directory: platform/v1/trigger
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'main' && 'Production' || 'Staging') }}
      # Staging secret values use an explicit STAGING_JINA_* namespace. Repository-
      # level JINA_* and generic secrets belong to production and are deliberately
      # unreachable from a staging deploy. Staging variables remain environment-
      # scoped JINA_* values and never use generic fallbacks.
      STAGING_JINA_TRIGGER_ACCESS_TOKEN_VALUE: ${{ secrets.STAGING_JINA_TRIGGER_ACCESS_TOKEN }}
      JINA_TRIGGER_ACCESS_TOKEN_VALUE: ${{ secrets.JINA_TRIGGER_ACCESS_TOKEN }}
      GENERIC_TRIGGER_ACCESS_TOKEN_VALUE: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      JINA_TRIGGER_API_URL_VALUE: ${{ vars.JINA_TRIGGER_API_URL }}
      GENERIC_TRIGGER_API_URL_VALUE: ${{ vars.TRIGGER_API_URL }}
      JINA_TRIGGER_PROJECT_REF_VALUE: ${{ vars.JINA_TRIGGER_PROJECT_REF }}
      GENERIC_TRIGGER_PROJECT_REF_VALUE: ${{ vars.TRIGGER_PROJECT_REF }}
      JINA_API_BASE_URL_VALUE: ${{ vars.JINA_API_BASE_URL }}
      GENERIC_API_BASE_URL_VALUE: ${{ vars.API_BASE_URL }}
      JINA_DASHBOARD_URL_VALUE: ${{ vars.JINA_DASHBOARD_URL }}
      GENERIC_DASHBOARD_URL_VALUE: ${{ vars.DASHBOARD_URL }}
      JINA_GITHUB_APP_ID_VALUE: ${{ vars.JINA_GITHUB_APP_ID }}
      STAGING_JINA_GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.STAGING_JINA_GITHUB_APP_PRIVATE_KEY }}
      JINA_GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.JINA_GITHUB_APP_PRIVATE_KEY }}
      GENERIC_GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      STAGING_JINA_GITHUB_CLONE_TOKEN_VALUE: ${{ secrets.STAGING_JINA_GITHUB_CLONE_TOKEN }}
      JINA_GITHUB_CLONE_TOKEN_VALUE: ${{ secrets.JINA_GITHUB_CLONE_TOKEN }}
      GENERIC_GITHUB_CLONE_TOKEN_VALUE: ${{ secrets.GITHUB_CLONE_TOKEN }}
      STAGING_JINA_INTERNAL_API_TOKEN_VALUE: ${{ secrets.STAGING_JINA_INTERNAL_API_TOKEN }}
      JINA_INTERNAL_API_TOKEN_VALUE: ${{ secrets.JINA_INTERNAL_API_TOKEN }}
      GENERIC_INTERNAL_API_TOKEN_VALUE: ${{ secrets.INTERNAL_API_TOKEN }}
      STAGING_JINA_DAYTONA_API_KEY_VALUE: ${{ secrets.STAGING_JINA_DAYTONA_API_KEY }}
      JINA_DAYTONA_API_KEY_VALUE: ${{ secrets.JINA_DAYTONA_API_KEY }}
      GENERIC_DAYTONA_API_KEY_VALUE: ${{ secrets.DAYTONA_API_KEY }}
      STAGING_JINA_OPENROUTER_API_KEY_VALUE: ${{ secrets.STAGING_JINA_OPENROUTER_API_KEY }}
      JINA_OPENROUTER_API_KEY_VALUE: ${{ secrets.JINA_OPENROUTER_API_KEY }}
      GENERIC_OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
      # Optional: managed OpenAI key that enables the capture proxy's native route
      # for openai/* reviews. Sourced from the same JINA_OPENAI_API_KEY secret used
      # elsewhere, mirroring how OPENROUTER_API_KEY is resolved.
      STAGING_JINA_OPENAI_API_KEY_VALUE: ${{ secrets.STAGING_JINA_OPENAI_API_KEY }}
      JINA_OPENAI_API_KEY_VALUE: ${{ secrets.JINA_OPENAI_API_KEY }}
      GENERIC_OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      JINA_OPENROUTER_APP_URL_VALUE: ${{ vars.JINA_OPENROUTER_APP_URL }}
      GENERIC_OPENROUTER_APP_URL_VALUE: ${{ vars.OPENROUTER_APP_URL }}
      JINA_OPENROUTER_APP_TITLE_VALUE: ${{ vars.JINA_OPENROUTER_APP_TITLE }}
      GENERIC_OPENROUTER_APP_TITLE_VALUE: ${{ vars.OPENROUTER_APP_TITLE }}
      JINA_CODEGRAPH_TIMEOUT_MS_VALUE: ${{ vars.JINA_CODEGRAPH_TIMEOUT_MS }}
      GENERIC_CODEGRAPH_TIMEOUT_MS_VALUE: ${{ vars.CODEGRAPH_TIMEOUT_MS }}
      JINA_GRAPH_MCP_ENABLED_VALUE: ${{ vars.JINA_GRAPH_MCP_ENABLED }}
      GENERIC_GRAPH_MCP_ENABLED_VALUE: ${{ vars.GRAPH_MCP_ENABLED }}
      JINA_CODEX_REVIEW_TIMEOUT_MS_VALUE: ${{ vars.JINA_CODEX_REVIEW_TIMEOUT_MS }}
      GENERIC_CODEX_REVIEW_TIMEOUT_MS_VALUE: ${{ vars.CODEX_REVIEW_TIMEOUT_MS }}
      JINA_REVIEW_CODEX_MODEL_VALUE: ${{ vars.JINA_REVIEW_CODEX_MODEL }}
      GENERIC_REVIEW_CODEX_MODEL_VALUE: ${{ vars.REVIEW_CODEX_MODEL }}
      JINA_REVIEW_CODEX_EFFORT_VALUE: ${{ vars.JINA_REVIEW_CODEX_EFFORT }}
      GENERIC_REVIEW_CODEX_EFFORT_VALUE: ${{ vars.REVIEW_CODEX_EFFORT }}
      JINA_RUNTIME_PLANNER_MODEL_VALUE: ${{ vars.JINA_RUNTIME_PLANNER_MODEL }}
      GENERIC_RUNTIME_PLANNER_MODEL_VALUE: ${{ vars.RUNTIME_PLANNER_MODEL }}
      JINA_RUNTIME_AGENT_MODEL_VALUE: ${{ vars.JINA_RUNTIME_AGENT_MODEL }}
      GENERIC_RUNTIME_AGENT_MODEL_VALUE: ${{ vars.RUNTIME_AGENT_MODEL }}
      JINA_RUNTIME_MENTAL_TRACE_MODEL_VALUE: ${{ vars.JINA_RUNTIME_MENTAL_TRACE_MODEL }}
      GENERIC_RUNTIME_MENTAL_TRACE_MODEL_VALUE: ${{ vars.RUNTIME_MENTAL_TRACE_MODEL }}
      JINA_DAYTONA_RUN_TIMEOUT_SECONDS_VALUE: ${{ vars.JINA_DAYTONA_RUN_TIMEOUT_SECONDS }}
      GENERIC_DAYTONA_RUN_TIMEOUT_SECONDS_VALUE: ${{ vars.DAYTONA_RUN_TIMEOUT_SECONDS }}
      JINA_DAYTONA_SETUP_TIMEOUT_SECONDS_VALUE: ${{ vars.JINA_DAYTONA_SETUP_TIMEOUT_SECONDS }}
      GENERIC_DAYTONA_SETUP_TIMEOUT_SECONDS_VALUE: ${{ vars.DAYTONA_SETUP_TIMEOUT_SECONDS }}
      JINA_DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS_VALUE: ${{ vars.JINA_DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS }}
      GENERIC_DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS_VALUE: ${{ vars.DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS }}
      JINA_DAYTONA_SNAPSHOT_VALUE: ${{ vars.JINA_DAYTONA_SNAPSHOT }}
      GENERIC_DAYTONA_SNAPSHOT_VALUE: ${{ vars.DAYTONA_SNAPSHOT }}
      JINA_DAYTONA_SANDBOX_IMAGE_VALUE: ${{ vars.JINA_DAYTONA_SANDBOX_IMAGE }}
      GENERIC_DAYTONA_SANDBOX_IMAGE_VALUE: ${{ vars.DAYTONA_SANDBOX_IMAGE }}
      JINA_DAYTONA_SANDBOX_CPU_VALUE: ${{ vars.JINA_DAYTONA_SANDBOX_CPU }}
      GENERIC_DAYTONA_SANDBOX_CPU_VALUE: ${{ vars.DAYTONA_SANDBOX_CPU }}
      JINA_DAYTONA_SANDBOX_MEMORY_VALUE: ${{ vars.JINA_DAYTONA_SANDBOX_MEMORY }}
      GENERIC_DAYTONA_SANDBOX_MEMORY_VALUE: ${{ vars.DAYTONA_SANDBOX_MEMORY }}
      JINA_DAYTONA_SANDBOX_DISK_VALUE: ${{ vars.JINA_DAYTONA_SANDBOX_DISK }}
      GENERIC_DAYTONA_SANDBOX_DISK_VALUE: ${{ vars.DAYTONA_SANDBOX_DISK }}
      JINA_DAYTONA_SKIP_INSTALL_VALUE: ${{ vars.JINA_DAYTONA_SKIP_INSTALL }}
      GENERIC_DAYTONA_SKIP_INSTALL_VALUE: ${{ vars.DAYTONA_SKIP_INSTALL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate configuration
        run: |
          set -euo pipefail
          write_env() {
            name="$1"
            value="${2:-}"
            delimiter="JINA_${name}_${RANDOM}_${RANDOM}"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }
          resolve() {
            output_name="$1"
            jina_name="$2"
            generic_name="${3:-}"
            default_value="${4:-}"
            value="${!jina_name:-}"
            # Generic (production) fallbacks apply only to Production deploys.
            if [ "$DEPLOY_ENVIRONMENT" = "Production" ] && [ -z "$value" ] && [ -n "$generic_name" ]; then
              value="${!generic_name:-}"
            fi
            if [ -z "$value" ] && [ -n "$default_value" ]; then
              value="$default_value"
            fi
            printf -v "$output_name" '%s' "$value"
          }
          resolve_secret() {
            output_name="$1"
            staging_name="$2"
            production_name="$3"
            generic_name="${4:-}"
            if [ "$DEPLOY_ENVIRONMENT" = "Staging" ]; then
              value="${!staging_name:-}"
            else
              value="${!production_name:-}"
              if [ -z "$value" ] && [ -n "$generic_name" ]; then
                value="${!generic_name:-}"
              fi
            fi
            printf -v "$output_name" '%s' "$value"
          }
          case "$DEPLOY_ENVIRONMENT" in
            Production)
              if [ "$GITHUB_REF_NAME" != "main" ]; then
                echo "Production deploys must run from main" >&2
                exit 1
              fi
              ;;
            Staging)
              if [ "$GITHUB_REF_NAME" != "staging" ]; then
                echo "Staging deploys must run from the staging branch" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported deployment environment: $DEPLOY_ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          resolve_secret TRIGGER_ACCESS_TOKEN STAGING_JINA_TRIGGER_ACCESS_TOKEN_VALUE JINA_TRIGGER_ACCESS_TOKEN_VALUE GENERIC_TRIGGER_ACCESS_TOKEN_VALUE
          resolve TRIGGER_API_URL JINA_TRIGGER_API_URL_VALUE GENERIC_TRIGGER_API_URL_VALUE https://api.trigger.dev
          resolve TRIGGER_PROJECT_REF JINA_TRIGGER_PROJECT_REF_VALUE GENERIC_TRIGGER_PROJECT_REF_VALUE
          resolve API_BASE_URL JINA_API_BASE_URL_VALUE GENERIC_API_BASE_URL_VALUE
          resolve DASHBOARD_URL JINA_DASHBOARD_URL_VALUE GENERIC_DASHBOARD_URL_VALUE
          resolve GITHUB_APP_ID JINA_GITHUB_APP_ID_VALUE
          resolve_secret GITHUB_APP_PRIVATE_KEY STAGING_JINA_GITHUB_APP_PRIVATE_KEY_VALUE JINA_GITHUB_APP_PRIVATE_KEY_VALUE GENERIC_GITHUB_APP_PRIVATE_KEY_VALUE
          resolve_secret GITHUB_CLONE_TOKEN STAGING_JINA_GITHUB_CLONE_TOKEN_VALUE JINA_GITHUB_CLONE_TOKEN_VALUE GENERIC_GITHUB_CLONE_TOKEN_VALUE
          resolve_secret INTERNAL_API_TOKEN STAGING_JINA_INTERNAL_API_TOKEN_VALUE JINA_INTERNAL_API_TOKEN_VALUE GENERIC_INTERNAL_API_TOKEN_VALUE
          resolve_secret DAYTONA_API_KEY STAGING_JINA_DAYTONA_API_KEY_VALUE JINA_DAYTONA_API_KEY_VALUE GENERIC_DAYTONA_API_KEY_VALUE
          resolve_secret OPENROUTER_API_KEY STAGING_JINA_OPENROUTER_API_KEY_VALUE JINA_OPENROUTER_API_KEY_VALUE GENERIC_OPENROUTER_API_KEY_VALUE
          resolve_secret OPENAI_API_KEY STAGING_JINA_OPENAI_API_KEY_VALUE JINA_OPENAI_API_KEY_VALUE GENERIC_OPENAI_API_KEY_VALUE
          resolve OPENROUTER_APP_URL JINA_OPENROUTER_APP_URL_VALUE GENERIC_OPENROUTER_APP_URL_VALUE
          resolve OPENROUTER_APP_TITLE JINA_OPENROUTER_APP_TITLE_VALUE GENERIC_OPENROUTER_APP_TITLE_VALUE
          resolve CODEGRAPH_TIMEOUT_MS JINA_CODEGRAPH_TIMEOUT_MS_VALUE GENERIC_CODEGRAPH_TIMEOUT_MS_VALUE
          resolve JINA_GRAPH_MCP_ENABLED JINA_GRAPH_MCP_ENABLED_VALUE GENERIC_GRAPH_MCP_ENABLED_VALUE true
          resolve CODEX_REVIEW_TIMEOUT_MS JINA_CODEX_REVIEW_TIMEOUT_MS_VALUE GENERIC_CODEX_REVIEW_TIMEOUT_MS_VALUE
          resolve REVIEW_CODEX_MODEL JINA_REVIEW_CODEX_MODEL_VALUE GENERIC_REVIEW_CODEX_MODEL_VALUE
          resolve REVIEW_CODEX_EFFORT JINA_REVIEW_CODEX_EFFORT_VALUE GENERIC_REVIEW_CODEX_EFFORT_VALUE
          resolve RUNTIME_PLANNER_MODEL JINA_RUNTIME_PLANNER_MODEL_VALUE GENERIC_RUNTIME_PLANNER_MODEL_VALUE
          resolve RUNTIME_AGENT_MODEL JINA_RUNTIME_AGENT_MODEL_VALUE GENERIC_RUNTIME_AGENT_MODEL_VALUE
          resolve RUNTIME_MENTAL_TRACE_MODEL JINA_RUNTIME_MENTAL_TRACE_MODEL_VALUE GENERIC_RUNTIME_MENTAL_TRACE_MODEL_VALUE
          resolve DAYTONA_RUN_TIMEOUT_SECONDS JINA_DAYTONA_RUN_TIMEOUT_SECONDS_VALUE GENERIC_DAYTONA_RUN_TIMEOUT_SECONDS_VALUE
          resolve DAYTONA_SETUP_TIMEOUT_SECONDS JINA_DAYTONA_SETUP_TIMEOUT_SECONDS_VALUE GENERIC_DAYTONA_SETUP_TIMEOUT_SECONDS_VALUE
          resolve DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS JINA_DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS_VALUE GENERIC_DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS_VALUE
          resolve DAYTONA_SNAPSHOT JINA_DAYTONA_SNAPSHOT_VALUE GENERIC_DAYTONA_SNAPSHOT_VALUE
          resolve DAYTONA_SANDBOX_IMAGE JINA_DAYTONA_SANDBOX_IMAGE_VALUE GENERIC_DAYTONA_SANDBOX_IMAGE_VALUE
          resolve DAYTONA_SANDBOX_CPU JINA_DAYTONA_SANDBOX_CPU_VALUE GENERIC_DAYTONA_SANDBOX_CPU_VALUE
          resolve DAYTONA_SANDBOX_MEMORY JINA_DAYTONA_SANDBOX_MEMORY_VALUE GENERIC_DAYTONA_SANDBOX_MEMORY_VALUE
          resolve DAYTONA_SANDBOX_DISK JINA_DAYTONA_SANDBOX_DISK_VALUE GENERIC_DAYTONA_SANDBOX_DISK_VALUE
          resolve DAYTONA_SKIP_INSTALL JINA_DAYTONA_SKIP_INSTALL_VALUE GENERIC_DAYTONA_SKIP_INSTALL_VALUE
          # GITHUB_CLONE_TOKEN is intentionally optional: every call site falls
          # back to the installation token when it is unset.
          required=(
            TRIGGER_ACCESS_TOKEN
            TRIGGER_PROJECT_REF
            API_BASE_URL
            DASHBOARD_URL
            DAYTONA_API_KEY
            GITHUB_APP_ID
            GITHUB_APP_PRIVATE_KEY
            INTERNAL_API_TOKEN
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          # OpenRouter is the only model gateway: managed reviews hard-require
          # OPENROUTER_API_KEY. Mirror the runtime preflight here so a misconfigured
          # deploy fails in CI, not per-review.
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then missing+=("OPENROUTER_API_KEY"); fi
          if [ "$DEPLOY_ENVIRONMENT" = "Staging" ]; then
            staging_values=(
              API_BASE_URL
              DASHBOARD_URL
            )
            for name in "${staging_values[@]}"; do
              if [[ "${!name:-}" != *staging* ]]; then
                missing+=("$name must contain staging")
              fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Trigger deployment configuration:" >&2
            if [ "$DEPLOY_ENVIRONMENT" = "Staging" ]; then
              echo "Staging deploys only read JINA_* environment variables and STAGING_JINA_* environment secrets; repository-level production fallbacks are ignored." >&2
            fi
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "API_BASE_URL must be the public HTTPS API origin for authenticated internal callbacks" >&2
              exit 1
              ;;
          esac
          case "$DASHBOARD_URL" in
            https://*) ;;
            *)
              echo "DASHBOARD_URL must be the public HTTPS dashboard origin for review links" >&2
              exit 1
              ;;
          esac
          for name in \
            TRIGGER_ACCESS_TOKEN \
            TRIGGER_API_URL \
            TRIGGER_PROJECT_REF \
            API_BASE_URL \
            DASHBOARD_URL \
            GITHUB_APP_ID \
            GITHUB_APP_PRIVATE_KEY \
            GITHUB_CLONE_TOKEN \
            INTERNAL_API_TOKEN \
            DAYTONA_API_KEY \
            OPENROUTER_API_KEY \
            OPENAI_API_KEY \
            OPENROUTER_APP_URL \
            OPENROUTER_APP_TITLE \
            CODEGRAPH_TIMEOUT_MS \
            JINA_GRAPH_MCP_ENABLED \
            CODEX_REVIEW_TIMEOUT_MS \
            REVIEW_CODEX_MODEL \
            REVIEW_CODEX_EFFORT \
            RUNTIME_PLANNER_MODEL \
            RUNTIME_AGENT_MODEL \
            RUNTIME_MENTAL_TRACE_MODEL \
            DAYTONA_RUN_TIMEOUT_SECONDS \
            DAYTONA_SETUP_TIMEOUT_SECONDS \
            DAYTONA_RESULT_DOWNLOAD_TIMEOUT_SECONDS \
            DAYTONA_SNAPSHOT \
            DAYTONA_SANDBOX_IMAGE \
            DAYTONA_SANDBOX_CPU \
            DAYTONA_SANDBOX_MEMORY \
            DAYTONA_SANDBOX_DISK \
            DAYTONA_SKIP_INSTALL; do
            write_env "$name" "${!name:-}"
          done

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: platform/v1/trigger/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Trigger.dev
        run: npm run deploy
