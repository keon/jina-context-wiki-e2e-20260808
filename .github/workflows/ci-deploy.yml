name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_PROJECT_ID: jina-v2
  GCP_PROJECT_NUMBER: "749416389045"
  GCP_REGION: us-central1
  GAR_REPOSITORY: jina
  API_SERVICE: jina-api
  DASHBOARD_SERVICE: jina-dashboard
  WORKER_SERVICE: jina-ontology-worker
  TASK_WORKER_SERVICE: jina-task-worker

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jina_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify PostgreSQL repository context contract
        run: pnpm --filter @jina/db test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build deployable containers
        run: |
          docker build --file apps/api/Dockerfile --tag jina-api-ci .
          docker build --file apps/worker/Dockerfile --tag jina-worker-ci .
          docker build --file apps/dashboard/Dockerfile --tag jina-dashboard-ci .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/749416389045/locations/global/workloadIdentityPools/github/providers/omxyz-jina
          service_account: github-deployer@jina-v2.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Deploy API
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.API_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/api:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=jina-runtime@jina-v2.iam.gserviceaccount.com
            --add-cloudsql-instances=jina-v2:us-central1:jina-postgres
            --concurrency=20
            --timeout=300
            --min-instances=0
            --max-instances=1
          env_vars: |-
            JINA_ENABLE_DEV_ENDPOINTS=false
            JINA_SIMULATE_RUNS=false
            JINA_SEED_DEMO=false
            JINA_TENANT_ID=omlabs
            JINA_TENANT_ADMIN_PRINCIPALS=user:keon@omlabs.xyz
            JINA_TENANT_ALIASES=github:unscoped,e2e-production,e2e
            INSTANCE_UNIX_SOCKET=/cloudsql/jina-v2:us-central1:jina-postgres
            DB_NAME=jina
            DB_USER=jina_app
          secrets: |-
            DB_PASS=jina-db-password:latest
            GITHUB_WEBHOOK_SECRET=jina-github-webhook-secret:latest
            INTERNAL_API_TOKEN=jina-internal-api-token:latest

      - name: Verify API health
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 3 "${{ steps.deploy-api.outputs.url }}/health"

      - name: Build and push ontology worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/worker:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Deploy ontology worker
        id: deploy-worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.WORKER_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/worker:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=jina-runtime@jina-v2.iam.gserviceaccount.com
            --concurrency=1
            --timeout=300
            --min-instances=1
            --max-instances=1
            --no-cpu-throttling
          env_vars: |-
            JINA_API_URL=${{ steps.deploy-api.outputs.url }}
            WORKER_TOPICS=run-ontology-ingest|run-ontology-assert|run-ontology-project|run-ontology|run-ontology-prepare|run-ontology-generate
            ONTOLOGY_HISTORY_LIMIT=10000
            DAYTONA_RUN_TIMEOUT_SECONDS=2400
            ONTOLOGY_CODEX_PROVIDER=openrouter
            ONTOLOGY_CODEX_MODEL=deepseek/deepseek-v4-flash
          secrets: |-
            INTERNAL_API_TOKEN=jina-internal-api-token:latest
            DAYTONA_API_KEY=jina-daytona-api-key:latest
            OPENROUTER_API_KEY=jina-openrouter-api-key:latest
            GITHUB_CLONE_TOKEN=jina-github-clone-token:latest

      - name: Verify ontology worker health
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 3 "${{ steps.deploy-worker.outputs.url }}/health" | jq -e '.ok == true and .topics == ["run-ontology-ingest", "run-ontology-assert", "run-ontology-project", "run-ontology", "run-ontology-prepare", "run-ontology-generate"] and ((keys - ["active", "lastApiSuccessAt", "lastWork", "ok", "topics", "workerId"]) | length == 0) and (.lastWork == null or ((.lastWork | keys) - ["failureCategory", "finishedAt", "outcome", "topic"] | length == 0))'

      - name: Deploy task worker
        id: deploy-task-worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.TASK_WORKER_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/worker:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=jina-runtime@jina-v2.iam.gserviceaccount.com
            --concurrency=1
            --timeout=300
            --min-instances=1
            --max-instances=1
            --no-cpu-throttling
          env_vars: |-
            JINA_API_URL=${{ steps.deploy-api.outputs.url }}
            WORKER_TOPICS=run-review|run-research|run-publish|run-cleanup
            REVIEW_MODEL=gpt-5.6-sol
          secrets: |-
            INTERNAL_API_TOKEN=jina-internal-api-token:latest
            OPENAI_API_KEY=jina-openai-api-key:latest
            GITHUB_CLONE_TOKEN=jina-github-clone-token:latest

      - name: Verify task worker health
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 3 "${{ steps.deploy-task-worker.outputs.url }}/health" | jq -e '.ok == true and .topics == ["run-review", "run-research", "run-publish", "run-cleanup"] and ((keys - ["active", "lastApiSuccessAt", "lastWork", "ok", "topics", "workerId"]) | length == 0) and (.lastWork == null or ((.lastWork | keys) - ["failureCategory", "finishedAt", "outcome", "topic"] | length == 0))'

      - name: Build and push dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dashboard:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Deploy dashboard
        id: deploy-dashboard
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.DASHBOARD_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/dashboard:${{ github.sha }}
          flags: >-
            --no-allow-unauthenticated
            --iap
            --service-account=jina-runtime@jina-v2.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=2
          env_vars: JINA_API_URL=${{ steps.deploy-api.outputs.url }}
          secrets: INTERNAL_API_TOKEN=jina-internal-api-token:latest

      - name: Configure dashboard IAP access
        run: |
          gcloud run services add-iam-policy-binding "${DASHBOARD_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --member="serviceAccount:service-${GCP_PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" --role="roles/run.invoker" --quiet
          iap_resource="https://iap.googleapis.com/v1/projects/${GCP_PROJECT_NUMBER}/iap_web/cloud_run-${GCP_REGION}/services/${DASHBOARD_SERVICE}"
          access_token="$(gcloud auth print-access-token)"
          current_policy="$(mktemp)"
          updated_policy="$(mktemp)"
          trap 'rm -f "${current_policy}" "${updated_policy}"' EXIT
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${access_token}" --header "Content-Type: application/json" --data '{}' "${iap_resource}:getIamPolicy" > "${current_policy}"
          jq --arg member "user:keon@omlabs.xyz" '
            .bindings = (
              [(.bindings // [])[] | select(.role != "roles/iap.httpsResourceAccessor")] +
              [{
                role: "roles/iap.httpsResourceAccessor",
                members: (([ (.bindings // [])[] | select(.role == "roles/iap.httpsResourceAccessor") | .members[]? ] + [$member]) | unique)
              }]
            ) | {policy: .}
          ' "${current_policy}" > "${updated_policy}"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${access_token}" --header "Content-Type: application/json" --data-binary @"${updated_policy}" "${iap_resource}:setIamPolicy" > /dev/null
          gcloud run services remove-iam-policy-binding "${DASHBOARD_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --member="user:keon@omlabs.xyz" --role="roles/run.invoker" --quiet || true

      - name: Verify dashboard
        run: |
          gcloud run services describe "${DASHBOARD_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json | jq -e '.metadata.annotations["run.googleapis.com/iap-enabled"] == "true"'
          iap_resource="https://iap.googleapis.com/v1/projects/${GCP_PROJECT_NUMBER}/iap_web/cloud_run-${GCP_REGION}/services/${DASHBOARD_SERVICE}"
          access_token="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${access_token}" --header "Content-Type: application/json" --data '{}' "${iap_resource}:getIamPolicy" | jq -e --arg member "user:keon@omlabs.xyz" 'any(.bindings[]?; .role == "roles/iap.httpsResourceAccessor" and any(.members[]?; . == $member))'

      - name: Verify production ontology workflow
        run: |
          gcloud run jobs deploy jina-acceptance \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/worker:${GITHUB_SHA}" \
            --service-account="jina-runtime@jina-v2.iam.gserviceaccount.com" \
            --set-env-vars="JINA_API_URL=${{ steps.deploy-api.outputs.url }},ACCEPTANCE_REQUEST_KEY=deploy-${GITHUB_SHA},ACCEPTANCE_TIMEOUT_MS=3000000,ACCEPTANCE_ISSUE_NUMBER=4,ACCEPTANCE_RESOLUTION_PR_NUMBER=5,ACCEPTANCE_CAUSING_PR_NUMBER=3,ACCEPTANCE_CAUSING_COMMIT_SHA=334234b30d3fe8c85fbf9f4c276d0ce6f26c35e2,ACCEPTANCE_CAUSAL_REASON_INCLUDES=admin,ACCEPTANCE_V51_FIXTURE=true" \
            --set-secrets="INTERNAL_API_TOKEN=jina-internal-api-token:latest" \
            --args=dist/acceptance.js \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=55m \
            --quiet
          acceptance_status=0
          gcloud run jobs execute jina-acceptance \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait || acceptance_status=$?
          execution_name="$(gcloud run jobs executions list \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --job=jina-acceptance \
            --sort-by='~metadata.creationTimestamp' \
            --limit=1 \
            --format='value(metadata.name)')"
          if [[ -n "${execution_name}" ]]; then
            gcloud run jobs executions describe "${execution_name}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='yaml(metadata.name,status.startTime,status.completionTime,status.conditions,status.failedCount,status.succeededCount)' || true
            task_name="$(gcloud run jobs executions tasks list \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --execution="${execution_name}" \
              --limit=1 \
              --format='value(metadata.name)')"
            if [[ -n "${task_name}" ]]; then
              gcloud run jobs executions tasks describe "${task_name}" \
                --project="${GCP_PROJECT_ID}" \
                --region="${GCP_REGION}" \
                --format=yaml || true
            fi
          fi
          exit "${acceptance_status}"

      - name: Publish deployment summary
        run: |
          {
            echo '## Cloud Run deployment'
            echo
            echo "- API: ${{ steps.deploy-api.outputs.url }}"
            echo "- Dashboard: ${{ steps.deploy-dashboard.outputs.url }}"
            echo "- Ontology worker: ${{ steps.deploy-worker.outputs.url }}"
            echo "- Task worker: ${{ steps.deploy-task-worker.outputs.url }}"
            echo "- Revision: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
