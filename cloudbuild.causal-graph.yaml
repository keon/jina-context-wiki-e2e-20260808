steps:
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name jina-ci-postgres --network cloudbuild \
          --env POSTGRES_DB=jina_test \
          --env POSTGRES_USER=postgres \
          --env POSTGRES_PASSWORD=postgres \
          postgres:16-alpine
        until docker exec jina-ci-postgres pg_isready -U postgres -d jina_test; do
          sleep 1
        done

  - id: validate
    name: node:22-bookworm
    waitFor: [start-postgres]
    entrypoint: bash
    args: [scripts/cloud-build-ci.sh]
    env:
      - TEST_DATABASE_URL=postgresql://postgres:postgres@jina-ci-postgres:5432/jina_test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:$BUILD_ID
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [validate]
    args:
      - build
      - --file=apps/worker/Dockerfile
      - --tag=us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:$BUILD_ID
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args: [push, us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:$BUILD_ID]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-worker]
    args: [push, us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:$BUILD_ID]

  - id: deploy-causal-graph
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:563.0.0
    waitFor: [push-api, push-worker]
    entrypoint: bash
    args: [scripts/cloud-build-deploy-causal-graph.sh]
    env:
      - GCP_PROJECT_ID=$PROJECT_ID
      - GCP_REGION=us-east1
      - CLOUD_BUILD_ID=$BUILD_ID
      - CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE}
      - JINA_DB_NAME=${_JINA_DB_NAME}
      - JINA_DB_USER=${_JINA_DB_USER}
      - JINA_MIGRATION_DB_USER=${_JINA_MIGRATION_DB_USER}
      - JINA_MIGRATION_DB_PASS_SECRET=${_JINA_MIGRATION_DB_PASS_SECRET}
      - JINA_CAUSAL_GRAPH_DAYTONA_SNAPSHOT=${_JINA_CAUSAL_GRAPH_DAYTONA_SNAPSHOT}
      - JINA_CAUSAL_GRAPH_DAYTONA_IMAGE=${_JINA_CAUSAL_GRAPH_DAYTONA_IMAGE}
      - JINA_CAUSAL_GRAPH_DAYTONA_MODEL_SECRET=${_JINA_CAUSAL_GRAPH_DAYTONA_MODEL_SECRET}
      - JINA_CAUSAL_GRAPH_WORKER_MEMORY=${_JINA_CAUSAL_GRAPH_WORKER_MEMORY}

substitutions:
  _CLOUD_SQL_INSTANCE: jina-v2:us-east1:jina-postgres
  _JINA_DB_NAME: jina
  _JINA_DB_USER: jina_app
  _JINA_MIGRATION_DB_USER: jina_app
  _JINA_MIGRATION_DB_PASS_SECRET: jina-primary-owner-db-password:latest
  _JINA_CAUSAL_GRAPH_DAYTONA_SNAPSHOT: ""
  _JINA_CAUSAL_GRAPH_DAYTONA_IMAGE: ""
  _JINA_CAUSAL_GRAPH_DAYTONA_MODEL_SECRET: ""
  _JINA_CAUSAL_GRAPH_WORKER_MEMORY: 1Gi

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/api:$BUILD_ID
  - us-east1-docker.pkg.dev/$PROJECT_ID/jina/worker:$BUILD_ID

timeout: 7200s
serviceAccount: projects/jina-v2/serviceAccounts/jina-cloud-build-deployer@jina-v2.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
